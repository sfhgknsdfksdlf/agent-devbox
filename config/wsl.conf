# Maps to /etc/wsl.conf inside the WSL distro.
# wsl-boot.sh attaches the data VHDX FROM INSIDE the distro and mounts it in Linux:
# it first makes EXACTLY ONE interop call -- a hard-timeout `wsl.exe --mount --vhd
# <path> --bare` (skipped when the device is already attached) -- then waits for the
# block device, finds it by UUID (`blkid -U`), `mount -t ext4` it at /mnt/<mntname>
# (see /etc/agent-devbox.conf), verifies the UUID, binds /home /root /workspace and
# only then starts the daemon. NO Windows scheduled task is created: the installer
# attaches the VHDX once and unregisters legacy agent-devbox*-mount-datadisk entries;
# the pure-batch install-dir mount-datadisk.cmd is the on-demand repair entry.
# The historical boot-loop reason still stands: NEVER call schtasks.exe or `wsl -d`,
# and never `--unmount` from `[boot]` -- re-entering WSL here caused a boot loop.
# If the disk cannot be mounted it enters MAINTENANCE MODE and refuses to seed/start;
# the banner prints the two copy-pasteable repair commands; it NEVER auto-launches
# the Windows installer.
# Append (`>>`) so repeated boots accumulate.
[boot]
command = /usr/local/bin/wsl-boot.sh >> /var/log/agent-devbox-boot.log 2>&1
systemd = false

[automount]
enabled = true
mountFsTab = false

# Locked: the interactive shell user is root.
[user]
default = root

# Kept enabled for the user's interactive shell (launching Windows .exe etc.).
# Boot does use exactly ONE interop call now: the bounded data-VHDX attach above.
# That is not the old boot-loop pattern; schtasks.exe, `wsl -d` and `--unmount`
# calls remain forbidden.
[interop]
enabled = true
appendWindowsPath = true
