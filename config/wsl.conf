# Maps to /etc/wsl.conf inside the WSL distro.
# wsl-boot.sh mounts the data disk PURELY IN LINUX: it locates the block device
# that is already attached by the Windows side (host logon Scheduled Task runs a
# hidden PowerShell `wsl --mount --vhd <path> --bare`), finds it by UUID
# (`blkid -U`), `mount -t ext4` it at /mnt/<mntname> (see /etc/agent-devbox.conf),
# verifies the UUID, binds /home /root /workspace and only then starts the daemon.
# It NEVER calls wsl.exe / schtasks.exe -- doing that from `[boot]` re-enters WSL
# and caused a boot loop. If the disk cannot be mounted it enters MAINTENANCE MODE
# and refuses to seed/start; it NEVER auto-launches the Windows installer.
# Append (`>>`) so repeated boots accumulate.
[boot]
command = /usr/local/bin/wsl-boot.sh >> /var/log/agent-devbox-boot.log 2>&1
systemd = false

[automount]
enabled = true
mountFsTab = false

# Locked: the interactive shell user is root.
[user]
default = root

# Kept enabled for the user's interactive shell (launching Windows .exe etc.).
# The boot script does NOT use interop any more: attaching the data disk is the
# Windows Scheduled Task's job.
[interop]
enabled = true
appendWindowsPath = true
