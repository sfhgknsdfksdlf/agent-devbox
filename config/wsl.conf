# Maps to /etc/wsl.conf inside the WSL distro.
# wsl-boot.sh prepares the data disk (mount + verify) and then starts the daemon;
# if the data disk is missing it enters MAINTENANCE MODE and refuses to seed/start.
[boot]
command = /usr/local/bin/wsl-boot.sh > /var/log/agent-devbox-boot.log 2>&1
systemd = false

[automount]
enabled = true
mountFsTab = false

# Locked: the interactive shell user is root.
[user]
default = root

# Required so wsl-boot.sh can auto-attach the VHDX via wsl.exe on first boot.
[interop]
enabled = true
appendWindowsPath = true
