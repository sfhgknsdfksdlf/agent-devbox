# Maps to /etc/wsl.conf inside the WSL distro.
# wsl-boot.sh attaches + verifies the data disk through a fallback mount chain
# (elevated Scheduled Task -> direct `wsl --mount --type ext4` -> `--bare` attach
# with a manual ext4 mount) and then starts the daemon. If the data disk cannot be
# mounted it enters MAINTENANCE MODE and refuses to seed/start; it NEVER
# auto-launches the Windows installer. Append (`>>`) so repeated boots accumulate.
[boot]
command = /usr/local/bin/wsl-boot.sh >> /var/log/agent-devbox-boot.log 2>&1
systemd = false

[automount]
enabled = true
mountFsTab = false

# Locked: the interactive shell user is root.
[user]
default = root

# Required so wsl-boot.sh can auto-attach the VHDX via wsl.exe on first boot.
[interop]
enabled = true
appendWindowsPath = true
