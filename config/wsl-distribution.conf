# Read by WSL when the distro is registered (`wsl --import`).
#
# WSL otherwise generates a Windows Terminal profile whose GUID is derived from
# the random registration GUID, so every reinstall creates a NEW profile and the
# user's customizations stay on the old one. The installer writes its own
# fragment with a fixed GUID instead (see Write-AgentDevboxTerminalProfile).
[windowsterminal]
enabled = false
