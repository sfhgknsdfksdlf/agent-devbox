# agent-devbox — Docker mode (pull-only; the image is built in CI, never locally).
# Quickstart:
#   cp .env.example .env   # set PASEO_PASSWORD
#   docker compose up -d
#   open http://localhost:6767
services:
  agent-devbox:
    image: "${IMAGE:-ghcr.io/sfhgknsdfksdlf/agent-devbox:latest}"
    container_name: agent-devbox
    restart: unless-stopped
    labels:
      - autoheal=true
    # Chromium needs more than the default 64m /dev/shm.
    shm_size: "1g"
    # gdb/lldb/strace need ptrace.
    cap_add:
      - SYS_PTRACE
    ports:
      - "6767:6767"          # ONLY published port (paseo daemon + bundled Web UI)
    environment:
      IS_DOCKER: "true"
      # REQUIRED: the daemon refuses to listen without a password.
      PASEO_PASSWORD: "${PASEO_PASSWORD:?set PASEO_PASSWORD in .env}"
      TZ: "${TZ:-Asia/Shanghai}"
      # To allow extra DNS hostnames (reverse proxy), also add a line like:
      #   PASEO_HOSTNAMES: "paseo.example.com,.lan"
    volumes:
      # The WHOLE home tree lives on the host: /home, /root and /workspace are
      # bind-mounted from DATA_DIR, so agent config/credentials, caches and
      # plugin state persist across image upgrades. DATA_DIR is explicit (no
      # default) and each subdirectory must already exist (create_host_path is
      # off). The whole DATA_DIR is also mounted READ-ONLY at
      # /run/agent-devbox/data; the entrypoint compares stat %d:%i there against
      # each target and fails closed before any write if a bind is wrong.
      - type: bind
        source: "${DATA_DIR:?set DATA_DIR}"
        target: /run/agent-devbox/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DATA_DIR:?set DATA_DIR}/home"
        target: /home
        bind:
          create_host_path: false
      - type: bind
        source: "${DATA_DIR:?set DATA_DIR}/root"
        target: /root
        bind:
          create_host_path: false
      - type: bind
        source: "${DATA_DIR:?set DATA_DIR}/project"
        target: /workspace
        bind:
          create_host_path: false

  # Health self-healing: restarts the container if its healthcheck fails.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
