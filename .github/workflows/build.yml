name: build
# Builds BOTH images in CI (never locally) and publishes them to ghcr.io:
#   ghcr.io/<owner>/agent-devbox-core   (lean base)
#   ghcr.io/<owner>/agent-devbox        (multi-agent, DEFAULT)
# Every push builds; only schedule / workflow_dispatch promote `latest` and cut
# a stable Release. Test builds (pushes) are DATED and bounded:
#   push to main       -> image <YYYYMMDD.HHMM>, prerelease beta-<YYYYMMDD.HHMM>
#   push to any branch -> image beta-<YYYYMMDD.HHMM>, prerelease beta-<YYYYMMDD.HHMM>
#   both pushes also move the :beta image alias; older beta-* prereleases are
#   pruned so only the newest survives (never `latest`).
# Scheduled/manual runs rebuild with no-cache so they actually fetch the latest
# upstream versions (a cached `npm install -g` layer would be reused otherwise);
# after such a run the workflow records the resolved versions into versions.json
# with a `[skip actions]` commit so the scheduled diff-gate can skip next time.
# The Release carries the WSL rootfs parts (the WSL image) + the 1Panel
# local-app zip (the local app store entry).
# amd64 and arm64 are BOTH built on every run - natively on ubuntu-latest and
# ubuntu-24.04-arm (free for public repos), no QEMU emulation - and merged into
# one multi-arch manifest. The WSL rootfs is exported per arch on those same
# native runners and published as rootfs-<variant>-<arch>.tar.zst.part-* with ONE
# merged SHA256SUMS covering both arches; Tier 3 (zstd.exe) is x64-only.
on:
  schedule:
    # ~every 3 days, in a quiet UTC window and off the top of the hour
    # (scheduled workflows queue behind everything else; top-of-hour is worst).
    - cron: "23 3 */3 * *"
  push:
    branches: ["**"]
    # Only files that can change the images (an empty keepalive commit matches
    # nothing here, so it no longer triggers a full build + Release).
    paths:
      - "Dockerfile"
      - "Dockerfile.agents"
      - "Dockerfile.wsl"
      - ".dockerignore"
      - "scripts/**"
      - "config/**"
      - "windows/**"
      - "1panel/**"
      - "versions.json"
      - ".github/workflows/build.yml"
      - ".github/workflows/keepalive.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if upstream versions are unchanged"
        type: boolean
        default: true

permissions:
  contents: write   # GitHub Release (rootfs assets)
  packages: write   # ghcr.io push

concurrency:
  # Every push build publishes the same moving `beta` prerelease + `:beta` image,
  # so pushes must not race: they share one serial group and only the newest one
  # wins. schedule/dispatch keep their own per-ref group.
  group: ${{ github.event_name == 'push' && 'build-beta' || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CORE_IMAGE: ghcr.io/${{ github.repository_owner }}/agent-devbox-core
  AGENTS_IMAGE: ghcr.io/${{ github.repository_owner }}/agent-devbox
  ZSTD_LEVEL: "12"

jobs:
  # ---------------------------------------------------------------------------
  # Skip the whole build on a scheduled run when no upstream version changed.
  # ---------------------------------------------------------------------------
  versions:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - id: diff
        run: |
          set -euo pipefail
          changed=false
          pkgs="
          opencode-ai
          oh-my-openagent
          @getpaseo/cli
          wrangler
          create-cloudflare
          @anthropic-ai/claude-code
          @openai/codex
          @google/gemini-cli
          @qwen-code/qwen-code
          @charmland/crush
          @github/copilot
          @earendil-works/pi-coding-agent
          @deepseek-ai/dsh
          @xai-official/grok
          zcode-app-cli
          "
          for pkg in $pkgs; do
            latest="$(npm view "$pkg" version 2>/dev/null || echo ERR)"
            have="$(jq -r --arg k "$pkg" '.[$k] // "MISSING"' versions.json)"
            echo "$pkg  have=$have  latest=$latest"
            if [ "$latest" != "ERR" ] && [ "$latest" != "$have" ]; then changed=true; fi
          done
          aider_latest="$(curl -fsSL https://pypi.org/pypi/aider-chat/json 2>/dev/null | jq -r '.info.version' 2>/dev/null || echo ERR)"
          aider_have="$(jq -r '."aider-chat" // "MISSING"' versions.json)"
          echo "aider-chat  have=$aider_have  latest=$aider_latest"
          if [ "$aider_latest" != "ERR" ] && [ "$aider_latest" != "$aider_have" ]; then changed=true; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then changed=true; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Static verification (no image build needed).
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats && shellcheck scripts/*.sh tests/run.sh && shellcheck -s sh config/profile.d/zz-agent-devbox-session-mount.sh
      - name: bash syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: YAML parse
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, yaml, sys
          files = glob.glob(".github/**/*.yml", recursive=True) \
              + glob.glob("1panel/**/*.yml", recursive=True) \
              + ["docker-compose.yml"]
          for f in files:
              yaml.safe_load(open(f))
              print("ok:", f)
          PY
      - name: compose config
        run: PASEO_PASSWORD=x docker compose -f docker-compose.yml config -q
      - name: actionlint
        run: docker run --rm -v "$PWD:/r" -w /r rhysd/actionlint:latest -color
      - name: hadolint
        # Mount the repo + set cwd so hadolint reads .hadolint.yaml (which
        # silences the intentional "pin versions" lint - see that file).
        run: docker run --rm -i -v "$PWD:/r" -w /r hadolint/hadolint < Dockerfile || true
      - name: bats
        run: tests/run.sh
      - name: windows/SHA256SUMS is current
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          # `--` so a filename starting with `-` can never be read as an option
          # (actionlint runs shellcheck, which flags a bare glob as SC2035).
          (cd windows && sha256sum -- *.ps1 *.cmd | sort -k2) > "$tmp"
          diff -u windows/SHA256SUMS "$tmp"
          rm -f "$tmp"
          echo 'windows/SHA256SUMS is current'

  # ---------------------------------------------------------------------------
  # PowerShell parse check on a real Windows runner.
  # ---------------------------------------------------------------------------
  ps-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell AST
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem windows -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
            Write-Host "ok: $($_.Name)"
          }
      - name: Enforce PowerShell encoding policy (BOM rules)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fail = $false
          foreach ($f in Get-ChildItem windows -Filter *.ps1) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            $hasBom = ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)
            if ($f.Name -eq 'install.ps1') {
              # The legacy in-memory web entry must NOT see a BOM (it survives as U+FEFF and breaks the parser).
              if ($hasBom) { Write-Error "install.ps1 must be UTF-8 WITHOUT a BOM (a BOM breaks the legacy in-memory web entry)"; $fail = $true }
              else { Write-Host "ok (no BOM): $($f.Name)" }
            } else {
              # -File path: PS 5.1 reads a BOM-less file as ANSI, garbling the Chinese.
              if (-not $hasBom) { Write-Error "$($f.Name) must be UTF-8 WITH a BOM (PS 5.1 -File would garble Chinese)"; $fail = $true }
              else { Write-Host "ok (BOM): $($f.Name)" }
            }
          }
          if ($fail) { exit 1 }
      - name: Enforce .cmd encoding policy (ASCII, CRLF)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fail = $false
          # Every .cmd helper is ASCII-only: cmd.exe reads a BOM-less file as
          # ANSI, so non-ASCII bytes would be garbled.
          foreach ($f in @(Get-ChildItem windows -Filter *.cmd)) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            if (@($b | Where-Object { $_ -gt 0x7F }).Count -gt 0) {
              Write-Error "$($f.Name) must be ASCII-only (cmd.exe reads a BOM-less file as ANSI)"
              $fail = $true
            }
          }
          # .cmd files must additionally be CRLF (their literals/ranges are
          # round-tripped by cmd.exe; LF-only risks a trailing-byte glitch).
          foreach ($f in @(Get-ChildItem windows -Filter *.cmd)) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            for ($i = 0; $i -lt $b.Length; $i++) {
              if ($b[$i] -eq 0x0A -and ($i -eq 0 -or $b[$i - 1] -ne 0x0D)) {
                Write-Error "$($f.Name) must use CRLF line endings"
                $fail = $true
                break
              }
            }
          }
          if ($fail) { exit 1 }
          Write-Host 'cmd encoding policy ok'
      - name: PowerShell unit tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/powershell/run.ps1
      - name: In-memory entry smoke (Windows PowerShell 5.1)
        # The production one-liner runs on PS 5.1: execute install.ps1 from its
        # text (not -File) and stop at mocked Read-Host/IRM/IWR/Start-Process.
        # Catches BOM/U+FEFF parse failures and `exit` regressions that AST-only
        # parsing cannot see.
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/powershell/iex-smoke.ps1
      - name: Segment order under Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/powershell/ps51-order.ps1
      - name: In-memory entry smoke (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File tests/powershell/iex-smoke.ps1
      - name: Pester pure helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0' })) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0
          }
          Invoke-Pester -Path tests/powershell/install.Tests.ps1 -CI -Output Detailed
  # ---------------------------------------------------------------------------
  # Decide the version tag / release tag / flags / arch matrix.
  #   schedule / workflow_dispatch -> image <YYYYMMDD.HHMM>, stable Release
  #                                   `build-<ts>`, promote `latest`, no :beta
  #   push to main                 -> image <YYYYMMDD.HHMM>, prerelease
  #                                   `beta-<ts>`, move `:beta`, NO promote
  #   push to any other branch     -> image + prerelease `beta-<ts>`,
  #                                   move `:beta`, NO promote
  # amd64 + arm64 are built on EVERY run (native runners).
  # ---------------------------------------------------------------------------
  plan:
    needs: [versions, lint, ps-lint]
    if: needs.versions.outputs.changed == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.set.outputs.ts }}
      tag: ${{ steps.set.outputs.tag }}
      release_tag: ${{ steps.set.outputs.release_tag }}
      promote: ${{ steps.set.outputs.promote }}
      beta_alias: ${{ steps.set.outputs.beta_alias }}
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          ts="$(date -u +'%Y%m%d.%H%M')"
          echo "ts=$ts" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Scheduled/manual runs cut a stable dated release and promote `latest`.
            {
              echo "tag=$ts"
              echo "release_tag=build-$ts"
              echo "promote=true"
              echo "beta_alias=false"
            } >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # main pushes: dated image tag, dated `beta-<ts>` prerelease, move :beta.
            {
              echo "tag=$ts"
              echo "release_tag=beta-$ts"
              echo "promote=false"
              echo "beta_alias=true"
            } >> "$GITHUB_OUTPUT"
          else
            # Non-main branches: dated `beta-<ts>` image tag + prerelease, move :beta.
            {
              echo "tag=beta-$ts"
              echo "release_tag=beta-$ts"
              echo "promote=false"
              echo "beta_alias=true"
            } >> "$GITHUB_OUTPUT"
          fi
          echo 'matrix={"include":[{"arch":"amd64","runner":"ubuntu-latest"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}' >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build core, then the multi-agent image, per architecture, on NATIVE runners.
  # ---------------------------------------------------------------------------
  build:
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push core (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.CORE_IMAGE }}:${{ needs.plan.outputs.tag }}-${{ matrix.arch }}
          provenance: false
          sbom: false
          no-cache: ${{ github.event_name != 'push' }}
          cache-from: type=gha,scope=core-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.arch }}

      - name: Build & push multi-agent (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agents
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            CORE_IMAGE=${{ env.CORE_IMAGE }}:${{ needs.plan.outputs.tag }}-${{ matrix.arch }}
          tags: ${{ env.AGENTS_IMAGE }}:${{ needs.plan.outputs.tag }}-${{ matrix.arch }}
          provenance: false
          sbom: false
          no-cache: ${{ github.event_name != 'push' }}
          cache-from: type=gha,scope=agents-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=agents-${{ matrix.arch }}

  # ---------------------------------------------------------------------------
  # Merge the per-arch images into one multi-arch manifest per image.
  # ---------------------------------------------------------------------------
  merge:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          TAG="${{ needs.plan.outputs.tag }}"
          for img in "${{ env.CORE_IMAGE }}" "${{ env.AGENTS_IMAGE }}"; do
            srcs=("$img:$TAG-amd64")
            if docker buildx imagetools inspect "$img:$TAG-arm64" >/dev/null 2>&1; then
              srcs+=("$img:$TAG-arm64")
            fi
            echo "manifest $img:$TAG <= ${srcs[*]}"
            docker buildx imagetools create -t "$img:$TAG" "${srcs[@]}"
            if [ "${{ needs.plan.outputs.beta_alias }}" = "true" ]; then
              echo "beta alias $img:beta <= ${srcs[*]}"
              docker buildx imagetools create -t "$img:beta" "${srcs[@]}"
            fi
          done

  # ---------------------------------------------------------------------------
  # Smoke test the candidate BEFORE promoting `latest`.
  # ---------------------------------------------------------------------------
  smoke:
    needs: [plan, merge]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Native architecture (${{ matrix.arch }})
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          case "$arch:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) echo "native runner ok: $(uname -m)";;
            *) echo "ERROR: runner $(uname -m) is not native ${{ matrix.arch }}"; exit 1;;
          esac
      - name: Image architecture matches the matrix
        run: |
          set -euo pipefail
          got=$(docker run --rm --platform linux/${{ matrix.arch }} \
                  --entrypoint /usr/bin/dpkg \
                  ${{ env.AGENTS_IMAGE }}:${{ needs.plan.outputs.tag }} --print-architecture)
          echo "dpkg arch=$got"; [ "$got" = "${{ matrix.arch }}" ]
      - name: Password is required (must fail without PASEO_PASSWORD)
        run: |
          set -euo pipefail
          set +e
          out=$(docker run --rm --platform linux/${{ matrix.arch }} -e IS_DOCKER=true \
                  ${{ env.AGENTS_IMAGE }}:${{ needs.plan.outputs.tag }} true 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: refused-to-listen-without-password guard did not trigger"; exit 1
          fi
          echo "$out" | grep -q "PASEO_PASSWORD is not set" || {
            echo "ERROR: refusal did not report the password reason"; echo "$out"; exit 1; }
          echo "ok: refuses without password"
      - name: Boot and health-check
        run: |
          set -euo pipefail
          docker run -d --name smoke --platform linux/${{ matrix.arch }} \
            -e IS_DOCKER=true -e PASEO_PASSWORD=smoke-test-pw \
            -p 16767:6767 \
            ${{ env.AGENTS_IMAGE }}:${{ needs.plan.outputs.tag }}
          code=000
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:16767/api/health || true)
            [ "$code" = "200" ] && break; sleep 3
          done
          echo "health=$code (after up to $i attempts)"; docker logs smoke | tail -40
          [ "$code" = "200" ]
      - name: Daemon runs as non-root paseo
        run: docker exec smoke sh -lc "ps -o user= -C node | sort -u | grep -q '^paseo$'"
      - name: Desktop app CLI probe (image contract)
        run: |
          set -euo pipefail
          out=$(docker exec smoke sh -lc 'if [ -x "$HOME/.opencode/bin/opencode" ]; then printf "%s\n" "$HOME/.opencode/bin/opencode"; fi')
          echo "probe=$out"
          [ "$out" = "/root/.opencode/bin/opencode" ]
          docker exec smoke desktop-cli-check.sh --home /root
      - name: PTY works (node-pty path)
        run: docker exec smoke bash -lc 'script -qec "echo pty-ok" /dev/null | grep -q pty-ok'
      - name: Published image stays lean (no WSL-only tooling)
        run: |
          set -euo pipefail
          for bin in dockerd docker pwsh fio osslsigncode evtxexport; do
            if docker exec smoke sh -lc "command -v $bin" >/dev/null 2>&1; then
              echo "ERROR: $bin must not exist in the published OCI image"; exit 1
            fi
          done
          for bin in bats shellcheck gh marksman; do
            docker exec smoke sh -lc "command -v $bin" >/dev/null || {
              echo "ERROR: $bin is missing from the published OCI image"; exit 1; }
          done
          docker exec smoke marksman --version
      - name: Tear down
        if: always()
        run: docker rm -f smoke || true

  # ---------------------------------------------------------------------------
  # Export the WSL rootfs per architecture on its NATIVE runner (no emulation)
  # and hand the parts to `publish` as build artifacts. Each job checks that the
  # exported rootfs really is the matrix arch (ELF header), so a mis-targeted
  # export fails here instead of shipping an unbootable WSL image.
  # ---------------------------------------------------------------------------
  export:
    needs: [plan, merge, smoke]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install zstd + file
        run: sudo apt-get update && sudo apt-get install -y zstd file
      - name: Assert native runner
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          case "$arch:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) echo "native: $(uname -m)";;
            *) echo "ERROR: runner arch $(uname -m) != ${{ matrix.arch }}"; exit 1;;
          esac
      - name: Export WSL rootfs (${{ matrix.arch }}) with zstd, split into <2GiB parts
        run: |
          set -euo pipefail
          TAG="${{ needs.plan.outputs.tag }}"
          arch="${{ matrix.arch }}"
          for pair in "core:${CORE_IMAGE}" "agents:${AGENTS_IMAGE}"; do
            v="${pair%%:*}"; img="${pair#*:}"; plat="linux/$arch"
            echo "== exporting $v from $img:$TAG ($plat) =="
            docker pull --platform "$plat" "$img:$TAG"
            # Rootfs-only overlay: Docker Engine + PowerShell never ship in the
            # published OCI image, so they are layered on here and exported.
            docker build --platform "$plat" -f Dockerfile.wsl \
              --build-arg BASE_IMAGE="$img:$TAG" -t "$img:$TAG-wsl" .
            got="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$img:$TAG-wsl")"
            if [ "$got" != "linux/$arch" ]; then
              echo "ERROR: overlay image is $got, expected linux/$arch"; exit 1
            fi
            docker run --rm --platform "$plat" --entrypoint /bin/sh "$img:$TAG-wsl" -c \
              'test -x /usr/bin/docker && test -x /usr/sbin/dockerd && test -x /usr/bin/pwsh && test -x /usr/bin/fio && test ! -e /var/lib/docker'
            docker run --rm --platform "$plat" --entrypoint pwsh "$img:$TAG-wsl" \
              -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
            docker run --rm --platform "$plat" --entrypoint docker "$img:$TAG-wsl" compose version
            cid=$(docker create --platform "$plat" "$img:$TAG-wsl")
            docker export "$cid" -o "rootfs-$v-${{ matrix.arch }}.tar"
            docker rm -f "$cid"
            docker rmi -f "$img:$TAG-wsl" >/dev/null
            elf=$(tar -xOf "rootfs-$v-${{ matrix.arch }}.tar" usr/bin/dash | file -)
            echo "elf: $elf"
            case "$arch:$elf" in
              amd64:*x86-64*) ;;
              arm64:*aarch64*) ;;
              *) echo "ERROR: rootfs-$v-${{ matrix.arch }}.tar is not ${{ matrix.arch }}: $elf"; exit 1;;
            esac
            zstd -T0 -${{ env.ZSTD_LEVEL }} -f "rootfs-$v-${{ matrix.arch }}.tar"
            rm -f "rootfs-$v-${{ matrix.arch }}.tar"
            split -b 1900M -d -a 2 "rootfs-$v-${{ matrix.arch }}.tar.zst" "rootfs-$v-${{ matrix.arch }}.tar.zst.part-"
            rm -f "rootfs-$v-${{ matrix.arch }}.tar.zst"
            mapfile -t parts < <(printf '%s\n' "rootfs-$v-${{ matrix.arch }}.tar.zst.part-"* | sort)
            part_elf=$(cat "${parts[@]}" | zstd -dc | tar -xOf - usr/bin/dash | file -)
            echo "parts elf: $part_elf"
            case "$arch:$part_elf" in
              amd64:*x86-64*) ;;
              arm64:*aarch64*) ;;
              *) echo "ERROR: rootfs-$v-${{ matrix.arch }} parts are not ${{ matrix.arch }}: $part_elf"; exit 1;;
            esac
          done
          ls -lh rootfs-*-${{ matrix.arch }}.tar.zst.part-*
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.arch }}
          path: rootfs-*-${{ matrix.arch }}.tar.zst.part-*
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

  # ---------------------------------------------------------------------------
  # Download the per-arch WSL rootfs parts exported by the `export` job, verify
  # that both arches are present and their part numbers are contiguous, write
  # ONE merged SHA256SUMS, and cut a Release carrying the rootfs parts (the WSL
  # image) + the 1Panel local-app zip (the local app store entry).
  #   schedule / workflow_dispatch -> stable Release `build-<ts>` on the dated
  #                                    tag, promote `latest`.
  #   push                          -> dated `beta-<ts>` prerelease so the
  #                                    Windows/WSL flow is testable; older beta-*
  #                                    releases are pruned so only the newest
  #                                    survives; `:beta` tracks the newest push.
  #                                    Never `latest`.
  # Scheduled/manual builds run with no-cache, so they actually fetch the latest
  # upstream versions; after such a build the resolved versions are recorded into
  # versions.json with a `[skip actions]` commit.
  # ---------------------------------------------------------------------------
  publish:
    needs: [plan, export]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote latest (both images)
        if: needs.plan.outputs.promote == 'true'
        run: |
          set -euo pipefail
          TAG="${{ needs.plan.outputs.tag }}"
          for img in "${{ env.CORE_IMAGE }}" "${{ env.AGENTS_IMAGE }}"; do
            docker buildx imagetools create -t "${img}:latest" "${img}:$TAG"
          done
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: rootfs-*
      - name: Verify both arches and contiguous parts
        run: |
          set -euo pipefail
          ls -lh artifacts
          for arch in amd64 arm64; do
            for v in core agents; do
              mapfile -t parts < <(printf '%s\n' "artifacts/rootfs-$v-$arch.tar.zst.part-"* | sort)
              [ -e "${parts[0]}" ] || { echo "ERROR: no $v/$arch parts"; exit 1; }
              i=0
              for p in "${parts[@]}"; do
                want=$(printf 'artifacts/rootfs-%s-%s.tar.zst.part-%02d' "$v" "$arch" "$i")
                [ "$p" = "$want" ] || { echo "ERROR: gap in $v/$arch: expected $want, got $p"; exit 1; }
                i=$((i+1))
              done
            done
          done
      - name: Stage rootfs parts
        run: |
          set -euo pipefail
          cp artifacts/rootfs-*-*.tar.zst.part-* .
          ls -lh rootfs-*-*.tar.zst.part-*

      # The installer verifies each part against this file. A length check alone
      # cannot detect a mixed/truncated part that happens to have the right size -
      # exactly what made every import tier fail on a real machine.
      - name: Write SHA256SUMS for the rootfs parts
        run: |
          set -euo pipefail
          sha256sum rootfs-*-*.tar.zst.part-* > SHA256SUMS
          cat SHA256SUMS

      # -------------------------------------------------------------------------
      # Package the 1Panel local app (top level: agent-devbox/) for the Release.
      # -------------------------------------------------------------------------
      - name: Package the 1Panel local app
        run: |
          set -euo pipefail
          command -v zip >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y zip; }
          cd 1panel && zip -r ../agent-devbox-1panel-localapp.zip agent-devbox
          ls -lh ../agent-devbox-1panel-localapp.zip

      - name: Create Release (stable on schedule/dispatch, dated `beta-<ts>` prerelease on push)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.release_tag }}
          name: ${{ needs.plan.outputs.promote == 'true' && format('build {0}', needs.plan.outputs.ts) || format('beta {0} (test build)', needs.plan.outputs.ts) }}
          prerelease: ${{ needs.plan.outputs.promote != 'true' }}
          make_latest: ${{ needs.plan.outputs.promote == 'true' }}
          overwrite_files: true
          # The rootfs parts ARE the WSL image; the 1Panel zip is the local app
          # store entry.
          files: |
            rootfs-*-*.tar.zst.part-*
            SHA256SUMS
            agent-devbox-1panel-localapp.zip
          generate_release_notes: true

      # Prune AFTER creating the new release and never delete the tag this run
      # just cut, so a cancellation/failure can never leave zero `beta-*`
      # releases (the WSL installer resolves the newest one).
      - name: Prune older `beta-*` prereleases (keep only the newest)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cur="${{ needs.plan.outputs.release_tag }}"
          gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | select(.tagName | startswith("beta-")) | .tagName' | while IFS= read -r t; do
            [ -n "$t" ] || continue
            if [ "$t" = "$cur" ]; then continue; fi
            echo "deleting old beta release: $t"
            gh release delete "$t" --yes --cleanup-tag || true
          done

      # -------------------------------------------------------------------------
      # The build above ran with no-cache for scheduled/manual runs, so record the
      # upstream versions this image actually resolved. The scheduled diff-gate
      # then skips a run when nothing changed. `[skip actions]` stops this commit
      # from re-triggering the workflow (versions.json is in on.push.paths).
      # -------------------------------------------------------------------------
      - name: Record resolved upstream versions
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          pkgs="
          opencode-ai
          oh-my-openagent
          @getpaseo/cli
          wrangler
          create-cloudflare
          @anthropic-ai/claude-code
          @openai/codex
          @google/gemini-cli
          @qwen-code/qwen-code
          @charmland/crush
          @github/copilot
          @earendil-works/pi-coding-agent
          @deepseek-ai/dsh
          @xai-official/grok
          zcode-app-cli
          "
          tmp="$(mktemp)"
          cp versions.json "$tmp"
          for pkg in $pkgs; do
            v="$(npm view "$pkg" version 2>/dev/null || true)"
            if [ -n "$v" ]; then
              jq --arg k "$pkg" --arg v "$v" '.[$k] = $v' "$tmp" > "$tmp.new"
              mv "$tmp.new" "$tmp"
            fi
          done
          aider="$(curl -fsSL https://pypi.org/pypi/aider-chat/json 2>/dev/null | jq -r '.info.version' 2>/dev/null || true)"
          if [ -n "$aider" ] && [ "$aider" != "null" ]; then
            jq --arg v "$aider" '."aider-chat" = $v' "$tmp" > "$tmp.new"
            mv "$tmp.new" "$tmp"
          fi
          if cmp -s "$tmp" versions.json; then
            echo "versions.json already up to date"
            exit 0
          fi
          cp "$tmp" versions.json
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore: record resolved upstream versions [skip actions]"
          git push
