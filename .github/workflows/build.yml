name: build
# Builds BOTH images in CI (never locally) and publishes them to ghcr.io:
#   ghcr.io/<owner>/agent-devbox-core   (lean base)
#   ghcr.io/<owner>/agent-devbox        (multi-agent, DEFAULT)
# Every push (except automation/versions) builds; only schedule /
# workflow_dispatch promote `latest` and cut a stable Release.
# Test builds (pushes) are DATED and bounded (suffix = <run_id>.<attempt>):
#   push to main       -> image <ts>-<run>.<attempt>, prerelease beta-<ts>-<run>.<attempt>
#   push to any branch -> image beta-<ts>-<run>.<attempt>, prerelease beta-<ts>-<run>.<attempt>
#   both pushes also move the :beta image alias; older beta-* prereleases are
#   pruned so only the newest survives (never `latest`).
# Scheduled/manual runs rebuild with no-cache so they actually fetch the latest
# upstream versions (a cached `npm install -g` layer would be reused otherwise);
# after such a run the workflow records the resolved versions on the
# automation/versions branch so the scheduled diff-gate can skip next time.
# The Release carries the WSL rootfs parts (the WSL image) + the 1Panel
# local-app zip (the local app store entry).
# amd64 and arm64 are BOTH built on every run - natively on ubuntu-latest and
# ubuntu-24.04-arm (free for public repos), no QEMU emulation - and merged into
# one multi-arch manifest. The WSL rootfs is exported per arch on those same
# native runners and published as rootfs-<variant>-<arch>.tar.zst.part-* with ONE
# merged SHA256SUMS covering both arches; Tier 3 (zstd.exe) is x64-only.
on:
  schedule:
    # Weekly on Sunday, in a quiet UTC window and off the top of the hour
    # (scheduled workflows queue behind everything else; top-of-hour is worst).
    - cron: "23 3 * * 0"
  push:
    # The publish job writes the resolved-version state here; it must never
    # trigger a build (that commit only changes versions.json).
    branches-ignore:
      - automation/versions
    # Only files that can change the images (an empty keepalive commit matches
    # nothing here, so it no longer triggers a full build + Release).
    paths:
      - "Dockerfile"
      - "Dockerfile.agents"
      - "Dockerfile.wsl"
      - ".dockerignore"
      - "scripts/**"
      - "config/**"
      - "windows/**"
      - "1panel/**"
      - "versions.json"
      - ".github/scripts/version-state.sh"
      - ".github/workflows/build.yml"
      - ".github/workflows/keepalive.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if upstream versions are unchanged"
        type: boolean
        default: true

# Least privilege: never grant at workflow scope. Each job opts in to exactly
# what it needs (see the D3 permission matrix); publish is the sole job that
# writes contents, versions/lint/ps-lint/plan only read, plan needs nothing.
permissions: {}

concurrency:
  # One serial group per channel: pushes (beta) never race each other, and
  # scheduled/manual runs (stable) never race each other. cancel-in-progress
  # false + queue max means an in-flight release is never killed and pending
  # releases wait their turn instead of replacing each other. The plan/publish
  # ordering guard protects against FIFO not being guaranteed.
  group: ${{ github.event_name == 'push' && 'build-beta' || 'build-stable' }}
  cancel-in-progress: false
  queue: max

env:
  CORE_IMAGE: ghcr.io/${{ github.repository_owner }}/agent-devbox-core
  AGENTS_IMAGE: ghcr.io/${{ github.repository_owner }}/agent-devbox
  ZSTD_LEVEL: "12"

jobs:
  # ---------------------------------------------------------------------------
  # Skip the whole build on a scheduled run when no upstream version changed.
  # ---------------------------------------------------------------------------
  versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      reason: ${{ steps.diff.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Load resolved-version state
        id: state
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin automation/versions >/dev/null 2>&1; then
            git fetch --depth=1 origin automation/versions
            git show FETCH_HEAD:versions.json > "$RUNNER_TEMP/versions-state.json"
            echo "file=$RUNNER_TEMP/versions-state.json" >> "$GITHUB_OUTPUT"
            echo "source=automation/versions" >> "$GITHUB_OUTPUT"
          else
            echo "file=versions.json" >> "$GITHUB_OUTPUT"
            echo "source=main-seed" >> "$GITHUB_OUTPUT"
          fi
      - id: diff
        run: |
          set -euo pipefail
          state="${{ steps.state.outputs.file }}"
          echo "state: $state"
          now="$(date -u +%FT%TZ)"
          # version-state.sh owns every upstream query (npm/PyPI). It compares
          # the tracked floating packages against the versions actually
          # installed in the last merged inventory and fails open (changed=true)
          # on a query error, a missing tools key or stale state.
          result="$(.github/scripts/version-state.sh --emit changed --manifest "$state" --now "$now")"
          printf '%s\n' "$result"
          changed="$(printf '%s\n' "$result" | sed -n 's/^changed=//p')"
          reason="$(printf '%s\n' "$result" | sed -n 's/^reason=//p')"
          if [ -z "$changed" ] || [ -z "$reason" ]; then
            echo "ERROR: version-state.sh did not report changed/reason" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            changed=true
            reason=forced
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Static verification (no image build needed).
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          set -euo pipefail
          # The digest-pinned image provides shellcheck 0.9.0; only bats is
          # installed from apt here.
          sudo apt-get update && sudo apt-get install -y bats
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.9.0@sha256:f35e8987b02760d4e76fc99a68ad5c42cc10bb32f3dd2143a3cf92f1e5446a45 scripts/*.sh tests/run.sh .github/scripts/*.sh
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.9.0@sha256:f35e8987b02760d4e76fc99a68ad5c42cc10bb32f3dd2143a3cf92f1e5446a45 -s sh config/profile.d/zz-agent-devbox-session-mount.sh
      - name: bash syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: YAML parse
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, yaml, sys
          files = glob.glob(".github/**/*.yml", recursive=True) \
              + glob.glob("1panel/**/*.yml", recursive=True) \
              + ["docker-compose.yml"]
          for f in files:
              yaml.safe_load(open(f))
              print("ok:", f)
          PY
      - name: compose config
        run: PASEO_PASSWORD=x docker compose -f docker-compose.yml config -q
      - name: actionlint
        run: docker run --rm -v "$PWD:/r" -w /r rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: hadolint
        # Mount the repo + set cwd so hadolint reads .hadolint.yaml (which
        # silences the intentional "pin versions" lint - see that file).
        # Every Dockerfile is checked; any finding fails this step (no `|| true`).
        run: |
          set -euo pipefail
          for f in Dockerfile Dockerfile.agents Dockerfile.wsl; do
            echo "== hadolint: $f =="
            docker run --rm -i -v "$PWD:/r" -w /r \
              hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e < "$f"
          done
      - name: bats
        run: tests/run.sh
      - name: windows/SHA256SUMS is current
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          # `--` so a filename starting with `-` can never be read as an option
          # (actionlint runs shellcheck, which flags a bare glob as SC2035).
          (cd windows && sha256sum -- *.ps1 *.cmd | sort -k2) > "$tmp"
          diff -u windows/SHA256SUMS "$tmp"
          rm -f "$tmp"
          echo 'windows/SHA256SUMS is current'

  # ---------------------------------------------------------------------------
  # PowerShell parse check on a real Windows runner.
  # ---------------------------------------------------------------------------
  ps-lint:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Parse PowerShell AST
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem windows -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
            Write-Host "ok: $($_.Name)"
          }
      - name: Enforce PowerShell encoding policy (BOM rules)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fail = $false
          foreach ($f in Get-ChildItem windows -Filter *.ps1) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            $hasBom = ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)
            if ($f.Name -eq 'install.ps1') {
              # The legacy in-memory web entry must NOT see a BOM (it survives as U+FEFF and breaks the parser).
              if ($hasBom) { Write-Error "install.ps1 must be UTF-8 WITHOUT a BOM (a BOM breaks the legacy in-memory web entry)"; $fail = $true }
              else { Write-Host "ok (no BOM): $($f.Name)" }
            } else {
              # -File path: PS 5.1 reads a BOM-less file as ANSI, garbling the Chinese.
              if (-not $hasBom) { Write-Error "$($f.Name) must be UTF-8 WITH a BOM (PS 5.1 -File would garble Chinese)"; $fail = $true }
              else { Write-Host "ok (BOM): $($f.Name)" }
            }
          }
          if ($fail) { exit 1 }
      - name: Enforce .cmd encoding policy (ASCII, CRLF)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fail = $false
          # Every .cmd helper is ASCII-only: cmd.exe reads a BOM-less file as
          # ANSI, so non-ASCII bytes would be garbled.
          foreach ($f in @(Get-ChildItem windows -Filter *.cmd)) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            if (@($b | Where-Object { $_ -gt 0x7F }).Count -gt 0) {
              Write-Error "$($f.Name) must be ASCII-only (cmd.exe reads a BOM-less file as ANSI)"
              $fail = $true
            }
          }
          # .cmd files must additionally be CRLF (their literals/ranges are
          # round-tripped by cmd.exe; LF-only risks a trailing-byte glitch).
          foreach ($f in @(Get-ChildItem windows -Filter *.cmd)) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            for ($i = 0; $i -lt $b.Length; $i++) {
              if ($b[$i] -eq 0x0A -and ($i -eq 0 -or $b[$i - 1] -ne 0x0D)) {
                Write-Error "$($f.Name) must use CRLF line endings"
                $fail = $true
                break
              }
            }
          }
          if ($fail) { exit 1 }
          Write-Host 'cmd encoding policy ok'
      - name: PowerShell unit tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/powershell/run.ps1
      - name: In-memory entry smoke (Windows PowerShell 5.1)
        # The production one-liner runs on PS 5.1: execute install.ps1 from its
        # text (not -File) and stop at mocked Read-Host/IRM/IWR/Start-Process.
        # Catches BOM/U+FEFF parse failures and `exit` regressions that AST-only
        # parsing cannot see.
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/powershell/iex-smoke.ps1
      - name: Segment order under Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/powershell/ps51-order.ps1
      - name: In-memory entry smoke (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File tests/powershell/iex-smoke.ps1
      - name: Pester unit tests (install + download)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0' })) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0
          }
          $result = Invoke-Pester -Path @('tests/powershell/install.Tests.ps1', 'tests/powershell/download.Tests.ps1') -CI -PassThru -Output Detailed
          if ($null -eq $result) { throw 'Invoke-Pester returned no result object' }
          $total = @($result.Tests).Count
          Write-Host ("Pester: passed={0} failed={1} skipped={2} total={3}" -f $result.PassedCount, $result.FailedCount, $result.SkippedCount, $total)
          if ($result.FailedCount -ne 0) { throw "Pester failures: $($result.FailedCount)" }
          # A download bind failure must FAIL, never skip; no test may be skipped in CI.
          if ($result.SkippedCount -ne 0) { throw "Pester skips are not allowed in CI: $($result.SkippedCount)" }
          if ($result.PassedCount -ne $total) { throw "Pester passed=$($result.PassedCount) but discovered=$total tests" }
      - name: Expected failure - loopback listener bind path is red
        # Injects AGENT_DEVBOX_TEST_HTTPLISTEN_FAIL=1 and proves the tagged
        # listener test fails after exactly 5 bind attempts with zero skips.
        # The main suite above stays green in the normal mode.
        shell: pwsh
        run: pwsh -NoProfile -File tests/powershell/download-failure.ps1
  # ---------------------------------------------------------------------------
  # Decide the version tag / release tag / flags / arch matrix.
  #   schedule / workflow_dispatch -> image <ts>-<run>.<attempt>, stable Release
  #                                   `build-<ts>-<run>.<attempt>`, promote `latest`
  #   push to main                 -> image <ts>-<run>.<attempt>, prerelease
  #                                   `beta-<ts>-<run>.<attempt>`, move `:beta`
  #   push to any other branch     -> image + prerelease
  #                                   `beta-<ts>-<run>.<attempt>`, move `:beta`
  # amd64 + arm64 are built on EVERY run (native runners).
  # ---------------------------------------------------------------------------
  plan:
    needs: [versions, lint, ps-lint]
    if: needs.versions.outputs.changed == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ts: ${{ steps.set.outputs.ts }}
      tag: ${{ steps.set.outputs.tag }}
      release_tag: ${{ steps.set.outputs.release_tag }}
      promote: ${{ steps.set.outputs.promote }}
      beta_alias: ${{ steps.set.outputs.beta_alias }}
      channel: ${{ steps.set.outputs.channel }}
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: set
        run: |
          set -euo pipefail
          ts="$(date -u +'%Y%m%d.%H%M')"
          {
            echo "ts=$ts"
            .github/scripts/release-tags.sh plan \
              --event "$GITHUB_EVENT_NAME" \
              --ref "$GITHUB_REF" \
              --run-id "$GITHUB_RUN_ID" \
              --attempt "$GITHUB_RUN_ATTEMPT" \
              --ts "$ts"
            echo 'matrix={"include":[{"arch":"amd64","runner":"ubuntu-latest"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}'
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build core, then the multi-agent image, per architecture, on NATIVE runners.
  # ---------------------------------------------------------------------------
  build:
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push core (${{ matrix.arch }})
        id: core
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.CORE_IMAGE }}:${{ needs.plan.outputs.tag }}-${{ matrix.arch }}
          provenance: false
          sbom: false
          no-cache: ${{ github.event_name != 'push' }}
          cache-from: type=gha,scope=core-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.arch }}

      - name: Build & push multi-agent (${{ matrix.arch }})
        id: agents
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.agents
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            CORE_IMAGE=${{ env.CORE_IMAGE }}@${{ steps.core.outputs.digest }}
          tags: ${{ env.AGENTS_IMAGE }}:${{ needs.plan.outputs.tag }}-${{ matrix.arch }}
          provenance: false
          sbom: false
          no-cache: ${{ github.event_name != 'push' }}
          cache-from: type=gha,scope=agents-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=agents-${{ matrix.arch }}

      - name: Record per-arch digests (${{ matrix.arch }})
        run: |
          set -euo pipefail
          printf '%s\n' '${{ steps.core.outputs.digest }}' > "digest-core-${{ matrix.arch }}"
          printf '%s\n' '${{ steps.agents.outputs.digest }}' > "digest-agents-${{ matrix.arch }}"
          cat "digest-core-${{ matrix.arch }}" "digest-agents-${{ matrix.arch }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: digest-*-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # The scheduled diff-gate compares upstream with what the previous build
      # actually INSTALLED, so record this arch's versions from the agents image.
      # This is the build-time proof; the exported rootfs inventory is the
      # authority `publish` merges (publish only reads version-inventory-rootfs).
      - name: Capture installed versions (${{ matrix.arch }})
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          digest="${{ steps.agents.outputs.digest }}"
          docker pull --platform "linux/$arch" "$AGENTS_IMAGE@$digest"
          tmp="$(mktemp)"
          docker run --rm --platform "linux/$arch" \
            --entrypoint /usr/local/bin/version-inventory.sh \
            "$AGENTS_IMAGE@$digest" --arch "$arch" --variant agents > "$tmp"
          mv "$tmp" "installed-build-$arch.json"
          jq -e --arg a "$arch" \
            '.schemaVersion == 1 and .arch == $a and .variant == "agents"' \
            "installed-build-$arch.json" >/dev/null
          jq -r '"tools=\(.tools | length) dpkg=\(.packages.dpkg | length)"' "installed-build-$arch.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: version-inventory-build-${{ matrix.arch }}
          path: installed-build-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  # ---------------------------------------------------------------------------
  # Merge the per-arch images into one multi-arch manifest per image.
  # ---------------------------------------------------------------------------
  merge:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      core_digest: ${{ steps.merge.outputs.core_digest }}
      agents_digest: ${{ steps.merge.outputs.agents_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: digests
          merge-multiple: true
          pattern: digests-*
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge verified per-arch digests into index digests
        id: merge
        env:
          CORE_IMAGE: ${{ env.CORE_IMAGE }}
          AGENTS_IMAGE: ${{ env.AGENTS_IMAGE }}
        run: |
          set -euo pipefail
          .github/scripts/merge-digests.sh \
            --dir digests \
            --tag "${{ needs.plan.outputs.tag }}" \
            --core-image "$CORE_IMAGE" \
            --agents-image "$AGENTS_IMAGE" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Smoke test the candidate BEFORE promoting `latest`.
  # ---------------------------------------------------------------------------
  smoke:
    needs: [plan, merge]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull merged index digests (${{ matrix.arch }})
        run: |
          set -euo pipefail
          docker pull --platform "linux/${{ matrix.arch }}" "${{ env.CORE_IMAGE }}@${{ needs.merge.outputs.core_digest }}"
          docker pull --platform "linux/${{ matrix.arch }}" "${{ env.AGENTS_IMAGE }}@${{ needs.merge.outputs.agents_digest }}"
      - name: Native architecture (${{ matrix.arch }})
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          case "$arch:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) echo "native runner ok: $(uname -m)";;
            *) echo "ERROR: runner $(uname -m) is not native ${{ matrix.arch }}"; exit 1;;
          esac
      - name: Both image variants match the matrix architecture
        run: |
          set -euo pipefail
          for pair in "core|${{ env.CORE_IMAGE }}@${{ needs.merge.outputs.core_digest }}" "agents|${{ env.AGENTS_IMAGE }}@${{ needs.merge.outputs.agents_digest }}"; do
            v="${pair%%|*}"
            img="${pair#*|}"
            got=$(docker run --rm --platform "linux/${{ matrix.arch }}" \
                    --entrypoint /usr/bin/dpkg "$img" --print-architecture)
            echo "$v dpkg arch=$got"
            [ "$got" = "${{ matrix.arch }}" ]
          done
      - name: Password is required for both variants
        run: |
          set -euo pipefail
          for pair in "core|${{ env.CORE_IMAGE }}@${{ needs.merge.outputs.core_digest }}" "agents|${{ env.AGENTS_IMAGE }}@${{ needs.merge.outputs.agents_digest }}"; do
            v="${pair%%|*}"
            img="${pair#*|}"
            set +e
            out=$(docker run --rm --platform "linux/${{ matrix.arch }}" -e IS_DOCKER=true "$img" true 2>&1)
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "ERROR: $v refused-to-listen-without-password guard did not trigger"; exit 1
            fi
            echo "$out" | grep -q "PASEO_PASSWORD is not set" || {
              echo "ERROR: $v refusal did not report the password reason"; echo "$out"; exit 1; }
            echo "ok: $v refuses without password"
          done
      - name: Boot and health-check both variants
        run: |
          set -euo pipefail
          for pair in "smoke|16767|${{ env.AGENTS_IMAGE }}@${{ needs.merge.outputs.agents_digest }}" "smoke-core|16768|${{ env.CORE_IMAGE }}@${{ needs.merge.outputs.core_digest }}"; do
            name="${pair%%|*}"
            rest="${pair#*|}"
            port="${rest%%|*}"
            img="${rest#*|}"
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker run -d --name "$name" --platform "linux/${{ matrix.arch }}" \
              -e IS_DOCKER=true -e PASEO_PASSWORD=smoke-test-pw \
              -p "$port:6767" "$img"
            code=000
            for i in $(seq 1 40); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/api/health" || true)
              [ "$code" = "200" ] && break; sleep 3
            done
            echo "$name health=$code (after up to $i attempts)"
            docker logs "$name" | tail -40
            [ "$code" = "200" ]
          done
      - name: Daemons run as non-root paseo
        run: |
          set -euo pipefail
          for name in smoke smoke-core; do
            docker exec "$name" sh -lc 'ps -eo user= | grep -qx paseo'
          done
      - name: Desktop app CLI probe (image contract)
        run: |
          set -euo pipefail
          for name in smoke smoke-core; do
            out=$(docker exec "$name" sh -lc 'if [ -x "$HOME/.opencode/bin/opencode" ]; then printf "%s\n" "$HOME/.opencode/bin/opencode"; fi')
            echo "$name probe=$out"
            [ "$out" = "/root/.opencode/bin/opencode" ]
            docker exec "$name" desktop-cli-check.sh --home /root
          done
      - name: PTY works (node-pty path)
        run: |
          set -euo pipefail
          for name in smoke smoke-core; do
            docker exec "$name" bash -lc 'script -qec "echo pty-ok" /dev/null | grep -q pty-ok'
          done
      - name: Published images stay lean (no WSL-only tooling)
        run: |
          set -euo pipefail
          for name in smoke smoke-core; do
            for bin in dockerd docker pwsh fio osslsigncode evtxexport; do
              if docker exec "$name" sh -lc "command -v $bin" >/dev/null 2>&1; then
                echo "ERROR: $bin must not exist in published image $name"; exit 1
              fi
            done
            for bin in bats shellcheck gh marksman; do
              docker exec "$name" sh -lc "command -v $bin" >/dev/null || {
                echo "ERROR: $bin is missing from published image $name"; exit 1; }
            done
            docker exec "$name" marksman --version
          done
      - name: Tear down
        if: always()
        run: docker rm -f smoke smoke-core || true

  # ---------------------------------------------------------------------------
  # Export the WSL rootfs per architecture on its NATIVE runner (no emulation)
  # and hand the parts to `publish` as build artifacts. Each job checks that the
  # exported rootfs really is the matrix arch (ELF header), so a mis-targeted
  # export fails here instead of shipping an unbootable WSL image.
  # ---------------------------------------------------------------------------
  export:
    needs: [plan, merge, smoke]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install zstd + file
        run: sudo apt-get update && sudo apt-get install -y zstd file
      - name: Assert native runner
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          case "$arch:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) echo "native: $(uname -m)";;
            *) echo "ERROR: runner arch $(uname -m) != ${{ matrix.arch }}"; exit 1;;
          esac
      - name: Export WSL rootfs (${{ matrix.arch }}) with zstd, split into <2GiB parts
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          CORE_DIGEST: ${{ needs.merge.outputs.core_digest }}
          AGENTS_DIGEST: ${{ needs.merge.outputs.agents_digest }}
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          for pair in "core|${CORE_IMAGE}|${CORE_DIGEST}" "agents|${AGENTS_IMAGE}|${AGENTS_DIGEST}"; do
            v="${pair%%|*}"
            rest="${pair#*|}"
            img="${rest%%|*}"
            digest="${rest#*|}"
            plat="linux/$arch"
            echo "== exporting $v from $img@$digest ($plat) =="
            docker pull --platform "$plat" "$img@$digest"
            # Rootfs-only overlay: Docker Engine + PowerShell never ship in the
            # published OCI image, so they are layered on here and exported.
            docker build --platform "$plat" -f Dockerfile.wsl \
              --build-arg BASE_IMAGE="$img@$digest" -t "$img:$TAG-wsl" .
            got="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$img:$TAG-wsl")"
            if [ "$got" != "linux/$arch" ]; then
              echo "ERROR: overlay image is $got, expected linux/$arch"; exit 1
            fi
            docker run --rm --platform "$plat" --entrypoint /bin/sh "$img:$TAG-wsl" -c \
              'test -x /usr/bin/docker && test -x /usr/sbin/dockerd && test -x /usr/bin/pwsh && test -x /usr/bin/fio && test ! -e /var/lib/docker'
            docker run --rm --platform "$plat" --entrypoint pwsh "$img:$TAG-wsl" \
              -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
            docker run --rm --platform "$plat" --entrypoint docker "$img:$TAG-wsl" compose version
            # The final agents overlay is exactly what WSL users import, so its
            # installed versions are the authoritative state `publish` merges.
            if [ "$v" = agents ]; then
              tmp="$(mktemp)"
              docker run --rm --platform "$plat" \
                --entrypoint /usr/local/bin/version-inventory.sh \
                "$img:$TAG-wsl" --arch "$arch" --variant agents > "$tmp"
              mv "$tmp" "installed-rootfs-$arch.json"
              jq -e --arg a "$arch" \
                '.schemaVersion == 1 and .arch == $a and .variant == "agents"' \
                "installed-rootfs-$arch.json" >/dev/null
            fi
            cid=$(docker create --platform "$plat" "$img:$TAG-wsl")
            docker export "$cid" -o "rootfs-$v-${{ matrix.arch }}.tar"
            docker rm -f "$cid"
            docker rmi -f "$img:$TAG-wsl" >/dev/null
            elf=$(tar -xOf "rootfs-$v-${{ matrix.arch }}.tar" usr/bin/dash | file -)
            echo "elf: $elf"
            case "$arch:$elf" in
              amd64:*x86-64*) ;;
              arm64:*aarch64*) ;;
              *) echo "ERROR: rootfs-$v-${{ matrix.arch }}.tar is not ${{ matrix.arch }}: $elf"; exit 1;;
            esac
            zstd -T0 -${{ env.ZSTD_LEVEL }} -f "rootfs-$v-${{ matrix.arch }}.tar"
            rm -f "rootfs-$v-${{ matrix.arch }}.tar"
            split -b 1900M -d -a 2 "rootfs-$v-${{ matrix.arch }}.tar.zst" "rootfs-$v-${{ matrix.arch }}.tar.zst.part-"
            rm -f "rootfs-$v-${{ matrix.arch }}.tar.zst"
            mapfile -t parts < <(printf '%s\n' "rootfs-$v-${{ matrix.arch }}.tar.zst.part-"* | sort)
            part_elf=$(cat "${parts[@]}" | zstd -dc | tar -xOf - usr/bin/dash | file -)
            echo "parts elf: $part_elf"
            case "$arch:$part_elf" in
              amd64:*x86-64*) ;;
              arm64:*aarch64*) ;;
              *) echo "ERROR: rootfs-$v-${{ matrix.arch }} parts are not ${{ matrix.arch }}: $part_elf"; exit 1;;
            esac
          done
          ls -lh rootfs-*-${{ matrix.arch }}.tar.zst.part-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rootfs-${{ matrix.arch }}
          path: rootfs-*-${{ matrix.arch }}.tar.zst.part-*
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: version-inventory-rootfs-${{ matrix.arch }}
          path: installed-rootfs-${{ matrix.arch }}.json
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

  # ---------------------------------------------------------------------------
  # Download the per-arch WSL rootfs parts exported by the `export` job, verify
  # that both arches are present and their part numbers are contiguous, write
  # ONE merged SHA256SUMS, and cut a Release carrying the rootfs parts (the WSL
  # image) + the 1Panel local-app zip (the local app store entry).
  #   schedule / workflow_dispatch -> stable Release `build-<ts>-<run>.<attempt>`,
  #                                    promote `latest` only after asset checks.
  #   push                          -> dated `beta-<ts>-<run>.<attempt>` prerelease
  #                                    so the Windows/WSL flow is testable; older
  #                                    beta-* releases are pruned; `:beta` tracks
  #                                    the newest push. Never `latest`.
  # Scheduled/manual builds run with no-cache, so they actually fetch the latest
  # upstream versions; after such a build the resolved versions are recorded on
  # the automation/versions branch, never on main.
  # ---------------------------------------------------------------------------
  publish:
    needs: [plan, merge, smoke, export]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # Deliberately keeps the default persisted checkout credentials: this
      # job pushes the automation/versions state branch (via git push below).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: rootfs-*
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: version-inventory-build
          merge-multiple: true
          pattern: version-inventory-build-*
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: version-inventory-rootfs
          merge-multiple: true
          pattern: version-inventory-rootfs-*
      - name: Verify both arches and contiguous parts
        run: |
          set -euo pipefail
          ls -lh artifacts
          for p in artifacts/rootfs-*.tar.zst.part-*; do
            case "$p" in
              artifacts/rootfs-core-amd64.tar.zst.part-*) ;;
              artifacts/rootfs-core-arm64.tar.zst.part-*) ;;
              artifacts/rootfs-agents-amd64.tar.zst.part-*) ;;
              artifacts/rootfs-agents-arm64.tar.zst.part-*) ;;
              *) echo "ERROR: unexpected rootfs part $p"; exit 1 ;;
            esac
          done
          for arch in amd64 arm64; do
            for v in core agents; do
              mapfile -t parts < <(printf '%s\n' "artifacts/rootfs-$v-$arch.tar.zst.part-"* | sort)
              [ -e "${parts[0]}" ] || { echo "ERROR: no $v/$arch parts"; exit 1; }
              i=0
              for p in "${parts[@]}"; do
                want=$(printf 'artifacts/rootfs-%s-%s.tar.zst.part-%02d' "$v" "$arch" "$i")
                [ "$p" = "$want" ] || { echo "ERROR: gap in $v/$arch: expected $want, got $p"; exit 1; }
                i=$((i+1))
              done
            done
          done
      - name: Verify version inventories
        run: |
          set -euo pipefail
          # One JSON per arch per group. The build inventories prove the agents
          # image the build produced; the rootfs inventories are authoritative
          # because they describe the overlay WSL actually imports.
          for group in build rootfs; do
            dir="version-inventory-$group"
            count="$(find "$dir" -maxdepth 1 -type f -name '*.json' | wc -l)"
            [ "$count" -eq 2 ] || { echo "ERROR: expected 2 inventories in $dir, found $count"; exit 1; }
            for arch in amd64 arm64; do
              f="$dir/installed-$group-$arch.json"
              [ -f "$f" ] || { echo "ERROR: missing $f"; exit 1; }
              jq -e --arg a "$arch" \
                '.schemaVersion == 1 and .arch == $a and .variant == "agents"' \
                "$f" >/dev/null
              echo "ok: $f tools=$(jq '.tools | length' "$f") dpkg=$(jq '.packages.dpkg | length' "$f")"
            done
          done
      - name: Stage rootfs parts
        run: |
          set -euo pipefail
          cp artifacts/rootfs-*-*.tar.zst.part-* .
          ls -lh rootfs-*-*.tar.zst.part-*

      # The installer verifies each part against this file. A length check alone
      # cannot detect a mixed/truncated part that happens to have the right size -
      # exactly what made every import tier fail on a real machine.
      - name: Write SHA256SUMS for the rootfs parts
        run: |
          set -euo pipefail
          sha256sum rootfs-*-*.tar.zst.part-* > SHA256SUMS
          cat SHA256SUMS
          staged=$(printf '%s\n' rootfs-*-*.tar.zst.part-* | wc -l)
          listed=$(wc -l < SHA256SUMS)
          [ "$staged" -eq "$listed" ] || { echo "ERROR: manifest lists $listed of $staged parts"; exit 1; }
          sha256sum -c SHA256SUMS

      # -------------------------------------------------------------------------
      # Package the 1Panel local app (top level: agent-devbox/) for the Release.
      # -------------------------------------------------------------------------
      - name: Package the 1Panel local app
        run: |
          set -euo pipefail
          command -v zip >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y zip; }
          cd 1panel && zip -r ../agent-devbox-1panel-localapp.zip agent-devbox
          ls -lh ../agent-devbox-1panel-localapp.zip
          unzip -t ../agent-devbox-1panel-localapp.zip

      - name: Create draft Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.plan.outputs.release_tag }}
          name: ${{ needs.plan.outputs.promote == 'true' && format('build {0}', needs.plan.outputs.ts) || format('beta {0} (test build)', needs.plan.outputs.ts) }}
          draft: true
          prerelease: ${{ needs.plan.outputs.promote != 'true' }}
          make_latest: false
          overwrite_files: true
          # The rootfs parts ARE the WSL image; the 1Panel zip is the local app
          # store entry.
          files: |
            rootfs-*-*.tar.zst.part-*
            SHA256SUMS
            agent-devbox-1panel-localapp.zip
          generate_release_notes: true

      - name: Verify uploaded Release assets
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL: ${{ needs.plan.outputs.release_tag }}
        run: |
          set -euo pipefail
          if ! release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$REL" 2>/dev/null)"; then
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$REL\")")"
          fi
          [ -n "$release_json" ] || { echo "ERROR: draft Release $REL is not visible"; exit 1; }
          release_id="$(jq -r '.id' <<<"$release_json")"
          [[ "$release_id" =~ ^[0-9]+$ ]] || { echo "ERROR: Release $REL has no id"; exit 1; }
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          jq -r '.assets[] | [.name, (.size|tostring), (.digest // "")] | @tsv' <<<"$release_json" | sort > uploaded.tsv
          missing="$(awk -F'\t' '$3 == "" { print $1 }' uploaded.tsv)"
          if [ -n "$missing" ]; then
            echo "ERROR: uploaded assets have no sha256 digest: $missing"
            exit 1
          fi
          : > expected.tsv
          for f in rootfs-*-*.tar.zst.part-* SHA256SUMS agent-devbox-1panel-localapp.zip; do
            printf '%s\t%s\tsha256:%s\n' "$f" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)" >> expected.tsv
          done
          sort -o expected.tsv expected.tsv
          diff -u expected.tsv uploaded.tsv

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL: ${{ needs.plan.outputs.release_tag }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          set -euo pipefail
          gh release edit "$REL" --draft=false
          if [ "$CHANNEL" = "stable" ]; then
            gh release edit "$REL" --latest
          else
            gh release edit "$REL" --prerelease
          fi

      - name: Promote channel alias by verified index digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          CORE_IMAGE: ${{ env.CORE_IMAGE }}
          AGENTS_IMAGE: ${{ env.AGENTS_IMAGE }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "stable" ]; then alias="latest"; else alias="beta"; fi
          .github/scripts/release-promote.sh \
            --core-image "$CORE_IMAGE" \
            --agents-image "$AGENTS_IMAGE" \
            --alias "$alias" \
            --core-digest "${{ needs.merge.outputs.core_digest }}" \
            --agents-digest "${{ needs.merge.outputs.agents_digest }}" \
            --release-tag "${{ needs.plan.outputs.release_tag }}" \
            --release-id "${{ steps.verify.outputs.release_id }}" \
            --state-file promotion-state.json

      - name: Persist promotion recovery state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: promotion-state.json
          if-no-files-found: warn
          retention-days: 7

      - name: Prune older beta prereleases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          REL: ${{ needs.plan.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" != "beta" ]; then
            echo "not a beta channel; skip prune"
            exit 0
          fi
          tags="$(gh release list --limit 100 --json tagName,isPrerelease,isDraft --jq '.[] | select(.isPrerelease and (.isDraft | not)) | select(.tagName | startswith("beta-")) | .tagName')"
          latest="$(printf '%s\n' "$tags" | .github/scripts/release-tags.sh newest)"
          set +e
          .github/scripts/release-tags.sh is-newer --candidate "$REL" --latest "$latest" --allow-equal
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "older run ($REL < $latest); skip prune"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: cannot compare $REL with $latest"; exit 1
          fi
          failed=()
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            if [ "$t" = "$REL" ]; then continue; fi
            set +e
            .github/scripts/release-tags.sh is-newer --candidate "$t" --latest "$REL"
            rc=$?
            set -e
            if [ "$rc" -eq 2 ]; then echo "ERROR: cannot compare $t with $REL"; exit 1; fi
            if [ "$rc" -eq 0 ]; then
              echo "keep newer release: $t"
              continue
            fi
            echo "deleting old beta release: $t"
            if ! gh release delete "$t" --yes --cleanup-tag; then failed+=("$t"); fi
          done <<< "$tags"
          if [ "${#failed[@]}" -gt 0 ]; then
            for t in "${failed[@]}"; do
              echo "retrying delete: $t"
              gh release delete "$t" --yes --cleanup-tag || { echo "ERROR: failed to prune $t"; exit 1; }
            done
          fi

      # -------------------------------------------------------------------------
      # The build above ran with no-cache for scheduled/manual runs. Record what
      # this image ACTUALLY installed on the dedicated state branch: `merge`
      # combines the authoritative per-arch rootfs inventories with the state
      # manifest. No upstream query happens here. main stays free of bot commits,
      # so feature branches do not drift every time the scheduled build runs.
      # `[skip actions]` is belt-and-braces: the automation/versions branch is
      # already excluded from on.push.
      # -------------------------------------------------------------------------
      - name: Record resolved upstream versions
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL: ${{ needs.plan.outputs.release_tag }}
        run: |
          set -euo pipefail
          stable_tags="$(gh release list --limit 100 --json tagName,isPrerelease,isDraft --jq '.[] | select((.isPrerelease | not) and (.isDraft | not)) | select(.tagName | startswith("build-")) | .tagName')"
          latest="$(printf '%s\n' "$stable_tags" | .github/scripts/release-tags.sh newest)"
          set +e
          .github/scripts/release-tags.sh is-newer --candidate "$REL" --latest "$latest" --allow-equal
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "older run ($REL < $latest); skip state update"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: cannot compare $REL with $latest"; exit 1
          fi
          # The helper lives on the build commit; the state branch may predate
          # it, so keep a copy before switching the worktree. The build commit's
          # v2 versions.json is also kept as the seed for a legacy (v1 flat)
          # state, so the first P1-2 migration cannot drop the fixed metadata.
          cp .github/scripts/version-state.sh "$RUNNER_TEMP/version-state.sh"
          cp versions.json "$RUNNER_TEMP/versions-seed.json"
          if git ls-remote --exit-code --heads origin automation/versions >/dev/null 2>&1; then
            git fetch --depth=1 origin automation/versions
            git checkout -B automation/versions FETCH_HEAD
          else
            git fetch --depth=1 origin main
            git checkout -b automation/versions FETCH_HEAD
          fi
          # A v2 state manifest is authoritative (keep its floating/fixed). A
          # legacy v1 flat state is migrated from the build commit's v2 seed;
          # only the merge output replaces versions.json, nothing else changes.
          if jq -e '.schemaVersion == 2' versions.json >/dev/null 2>&1; then
            base=versions.json
          else
            base="$RUNNER_TEMP/versions-seed.json"
          fi
          bash "$RUNNER_TEMP/version-state.sh" merge \
            --build-dir version-inventory-rootfs \
            --manifest "$base" \
            --out versions.json
          # Fail closed: every floating package must carry both arches (the
          # scheduled gate compares tools.<package>.amd64/arm64) and the build
          # must be dated. The rootfs inventories supply all of that.
          jq -e '
            ((.last_built | type) == "string")
            and (
              [ .floating | to_entries[] | .value.package ] as $pkgs
              | [ $pkgs[] as $p
                  | (.tools[$p] // null) as $t
                  | (($t | type) == "object")
                    and (($t.amd64 | type) == "string") and (($t.amd64) != "")
                    and (($t.arm64 | type) == "string") and (($t.arm64) != "")
                ] | all
            )
          ' versions.json >/dev/null
          if git diff --quiet -- versions.json; then
            echo "versions.json already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore: record resolved upstream versions [skip actions]"
          if ! git push origin HEAD:automation/versions; then
            git pull --rebase origin automation/versions
            git push origin HEAD:automation/versions
          fi
