# Keeps scheduled workflows enabled. GitHub disables `on.schedule` workflows in
# a public repo after 60 days without repository activity, so we make an empty
# commit only when main has been quiet for ~50 days (well within that window).
name: keepalive
on:
  schedule:
    - cron: "17 4 */20 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: keepalive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Empty commit only when main has been quiet for ~50 days
        run: .github/scripts/keepalive.sh --branch main --now "$(date -u +%s)"
