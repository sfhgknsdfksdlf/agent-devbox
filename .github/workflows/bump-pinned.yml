# =============================================================================
# bump-pinned — every 6 months, move the manually-pinned build ARGs
# (PLAYWRIGHT_VERSION, GO_VERSION) to the latest upstream, then rebuild.
#
# The floating packages (OpenCode, omo, wrangler, ...) refresh on the regular
# weekly build; these two are pinned on purpose so they only move on this
# slower cadence. A run with no upstream change does nothing.
#
# GO_VERSION moves together with BOTH linux sha256 rows in
# config/image-assets.sha256 (one atomic update-go call), because the Dockerfile
# verifies the tarball against that manifest before extracting it. Everything
# else in the manifest (uv, marksman, PowerShell) and the base-image/core-image
# digests are reviewed by a human and are NEVER touched by this workflow.
#
# NOTE: a `git push` made with the workflow GITHUB_TOKEN does NOT trigger other
# workflows, so we explicitly dispatch build.yml (workflow_dispatch is the
# documented exception and IS allowed with GITHUB_TOKEN).
# =============================================================================
name: bump-pinned
on:
  schedule:
    - cron: "0 5 1 */6 *"   # 05:00 UTC on the 1st of Jan / Jul
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: bump-pinned
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Bump the pinned ARGs if upstream moved
        id: bump
        run: |
          set -euo pipefail

          pw="$(curl -fsSL https://registry.npmjs.org/playwright/latest | jq -r '.version')"

          # Stable channel only: the first entry is the newest stable release.
          go_json="$(curl -fsSL 'https://go.dev/dl/?mode=json')"
          go="$(printf '%s' "$go_json" | jq -r '.[0].version')"
          case "$go" in
            go[0-9]*) go="${go#go}" ;;
            *) echo "ERROR: unexpected Go version from go.dev: $go" >&2; exit 1 ;;
          esac

          # Exactly one archive per architecture; a missing/duplicate entry is
          # fatal instead of silently updating half of the manifest.
          go_sha() {
            ASSET="$1" jq -er '
              [ .[0].files[]
                | select(.kind == "archive" and .filename == env.ASSET)
                | .sha256 ]
              | if length == 1 then .[0]
                else error("expected exactly one matching Go archive") end
            ' <<< "$go_json"
          }
          amd_sha="$(go_sha "go${go}.linux-amd64.tar.gz")"
          arm_sha="$(go_sha "go${go}.linux-arm64.tar.gz")"

          cur_pw="$(sed -n 's/^ARG PLAYWRIGHT_VERSION=//p' Dockerfile | head -1)"
          cur_go="$(sed -n 's/^ARG GO_VERSION=//p' Dockerfile | head -1)"
          echo "playwright: $cur_pw -> $pw"
          echo "go:         $cur_go -> $go"

          scripts/image-assets.sh verify-manifest config/image-assets.sha256

          changed=0
          if [ "$go" != "$cur_go" ]; then
            # Manifest first (validated, atomic), then the ARG: if either step
            # fails the job aborts before anything is committed or pushed.
            scripts/image-assets.sh update-go config/image-assets.sha256 "$go" "$amd_sha" "$arm_sha"
            sed -i "s|^ARG GO_VERSION=.*|ARG GO_VERSION=$go|" Dockerfile
            changed=1
          fi
          if [ "$pw" != "$cur_pw" ]; then
            sed -i "s|^ARG PLAYWRIGHT_VERSION=.*|ARG PLAYWRIGHT_VERSION=$pw|" Dockerfile
            changed=1
          fi

          if [ "$changed" -eq 0 ]; then
            echo "already up to date"
            exit 0
          fi

          scripts/image-assets.sh verify-manifest config/image-assets.sha256
          grep -qF "ARG GO_VERSION=$go" Dockerfile
          grep -qF "go${go}.linux-amd64.tar.gz" config/image-assets.sha256
          grep -qF "go${go}.linux-arm64.tar.gz" config/image-assets.sha256

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile config/image-assets.sha256
          git commit -m "chore: bump pinned Playwright/Go"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger a rebuild with the bumped versions
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref main
