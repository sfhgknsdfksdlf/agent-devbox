services:
  agent-devbox:
    image: ghcr.io/sfhgknsdfksdlf/agent-devbox:latest
    container_name: ${CONTAINER_NAME}
    restart: always
    shm_size: "1g"
    cap_add:
      - SYS_PTRACE
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:6767
    environment:
      IS_DOCKER: "true"
      PASEO_PASSWORD: ${PASEO_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./data/home:/home/paseo
      - ./data/project:/workspace
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true
